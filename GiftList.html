<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="Image/Placeholder/Placeholder scare.png">

    <script src="script.js" defer></script>
    <script src="Gift.js" defer></script>

    <title>Nom-De-La-Famille</title>
</head>

<body>
    <header>
        <div>
            <h1 id="TitleGiftList">Liste de Prenom chez Nom de Famille</h1>
        </div>
    </header>
    <main class="Loged">
        <div id="GiftListe">
            <Section class="block" style="display: flex;">
                <div style="width: 100%;">
                    <h3>Gift Title</h3>
                    <div class="tags-liste">
                        <p class="tag">Ordre de prix</p>
                        <p class="tag">Priorité</p>
                        <nav class="tag" style="display: flex;">
                            <a href="">Lier/Dépendence à name</a>
                        </nav>
                        <p class="tag">Catégorie</p>
                    </div>
                    <p class="Description">Description du cadeau et point clé spécifique
                    </p>
                    <div class="Flex">
                        <div class="Boolean">
                            <img src="Image/Placeholder/Placeholder scare.png" class="TrueVis Hide">
                        </div>
                        <a href="" class="Ref">Source 1</a>
                    </div>
                    <div class="Flex">
                        <div class="Boolean">
                            <img src="Image/Placeholder/Placeholder scare.png" class="TrueVis Hide">
                        </div>
                        <a href="" class="Ref">Liens pour la source 2</a>
                    </div>
                </div>
                <div style="width: 100%;">
                    <div class="Flex">
                        <p style="font-weight: bold;">10%</p>
                        <div class="ScrollBar">
                            <div class="Bar"></div>
                        </div>
                        <p style="font-weight: bold; font-size: 1.2rem;">100€</p>
                    </div>
                    <div>
                        <p class="Participant">Participant</p>
                        <div class="Flex">
                            <img src="Image/Placeholder/Placeholder scare.png" class="BtnPlus">
                            <p class="PartRef">Participant B</p>
                            <p class="PartPrix">3€</p>
                        </div>
                        <div>
                            <div class="Flex" style="margin-bottom: 0.5rem;">
                                <p class="PartRef">Participant A</p>
                                <p class="PartPrix">7€</p>
                            </div>
                            <div class="Flex" style="margin-bottom: 0.5rem;">
                                <p class="PartRef">Participant B</p>
                                <p class="PartPrix">3€</p>
                            </div>
                        </div>
                    </div>
                </div>
            </Section>
        </div>
    </main>
    <main class="Unloged Hide">
        <a class="block EmptyPage" href="LogScreen.html">
            <h3>Connectez-vous</h3>
        </a>
    </main>
</body>

</html>
