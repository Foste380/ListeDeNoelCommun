<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="Image/Placeholder/Placeholder scare.png">

    <script src="script.js" defer></script>

    <title>ListePartager</title>
</head>

<body>
    <header>
        <div>
            <h1 id="Title">Mon-Prenom</h1>
        </div>
        <section class="famille Loged">
            <h3 id="Family" style="cursor: pointer;">Nom-De-La-Famille</h3>
            <section id="FamilyListe" class="Hide">

            </section>
        </section>
    </header>
    <main class="Loged">

        <div class="block Debug" id="LogOut" style="cursor: pointer;">
            <h3>
                Logout
            </h3>
        </div>
        <a href="" id="MaListe" class="main-block">
            <div>
                <h3>Ma Liste de cadeau</h3>
                <div class="tags-liste">
                    <p class="tag">X idée</p>
                    <p class="tag">4 sans liens</p>
                </div>
            </div>
        </a>
        <div id="SearchBar" class="search_bar">
            <img src="Image/Placeholder/Placeholder scare.png">
            <input type="text" id="Search" placeholder="Rechercher...">
        </div>
        <div id="MembreListe">

        </div>
    </main>
    <main class="Unloged Hide">
        <a class="block EmptyPage" href="LogScreen.html">
            <h3>Connectez-vous</h3>
        </a>
    </main>
    <main class="Loged info" id="NoFamMess">
        <div class="block EmptyPage">
            <h3>Pas de famille</h3>
        </div>
    </main>
</body>

</html>
