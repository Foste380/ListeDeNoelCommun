<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="Image/Placeholder/Placeholder scare.png">

    <script src="script.js" defer></script>

    <title>Connection/Inscription</title>
</head>

<body>
    <header>
        <div>
            <h1>CONNECTEZ / INSCRIVEZ-VOUS</h1>
        </div>
    </header>
    <main class="LogInGrid">
        <div>
            <div class="Part">
                <input type="text" id="LogInText" placeholder="Prenom ou Pseudo...">
                <div class="block" id="BtnLogIn" style="cursor: pointer;">
                    <h3>Connection</h3>
                </div>
            </div>
            <div class="Part">
                <input type="text" id="SignInText" placeholder="Prenom ou pseudo">
                <div class="block" id="BtnSignIn" style="cursor: pointer;">
                    <h3>Inscription</h3>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
